      <stop stop-color="#1e2234"/>
      <stop offset="0.55" stop-color="#232842"/>
      <stop offset="1" stop-color="#181e43"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(240 140) rotate(48) scale(560)">
      <stop stop-color="#3b5fe0" stop-opacity="0.42"/>
