    <circle cx="94" cy="-46" r="6" fill="#67e8f9"/>
    <circle cx="-58" cy="-92" r="5.5" fill="#60a5fa"/>
    <circle cx="82" cy="88" r="6" fill="#60a5fa"/>
    <circle cx="-90" cy="46" r="5.5" fill="#818cf8"/>
